name: Garfield checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q garfield_best.py garfield_flagship.py garfield_dashboard
      - name: Test safety and regressions
        run: python -m unittest discover -s tests -v
